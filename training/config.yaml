# Start here. Once the full pipeline runs end to end on the 1.5B model,
# duplicate this file (e.g. config_7b.yaml) to try the larger model and
# compare results — don't tune blind, compare against evaluation/evaluate.py.

model_name: "unsloth/Qwen2.5-1.5B-Instruct-bnb-4bit"

max_seq_length: 1024
load_in_4bit: true
seed: 42

# LoRA
lora_r: 16
lora_alpha: 16

# Training
batch_size: 4
gradient_accumulation_steps: 4
warmup_steps: 20
num_epochs: 3
learning_rate: 0.0002
eval_steps: 50

# Paths
train_path: "data/processed/train.jsonl"
val_path: "data/processed/val.jsonl"
output_dir: "training/checkpoints"
